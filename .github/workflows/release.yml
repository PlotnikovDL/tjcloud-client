name: Tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recheck protected tag ancestry
        shell: pwsh
        run: ./scripts/Test-BranchPolicy.ps1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node 24
        with:
          name: windows-packages
          path: unsigned
          skip-decompress: false
          digest-mismatch: error
      - name: Prepare pinned public release tools
        shell: pwsh
        run: |
          ./scripts/Build-ReleaseTools.ps1 -ArtifactsRoot "$env:RUNNER_TEMP/release-tools"
          ./scripts/Get-AppCastGenerator.ps1 -ToolRoot "$env:RUNNER_TEMP/appcast-generator"
      - name: Sign final installer and appcast after approval
        shell: pwsh
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ($env:GITHUB_REF -cne "refs/tags/v$env:BUILD_VERSION") { throw 'Release tag/version mismatch.' }
          ./scripts/New-ReleaseFeed.ps1 -InputDirectory ./unsigned -OutputDirectory ./release -GeneratorPath "$env:RUNNER_TEMP/appcast-generator/netsparkle-generate-appcast.exe" -VerifierDll "$env:RUNNER_TEMP/release-tools/bin/ReleaseTools/release/ReleaseTools.dll"
      - name: Verify final signed release manifest
        shell: pwsh
        run: ./scripts/Test-ReleaseAssets.ps1 -Directory ./release -VerifierDll "$env:RUNNER_TEMP/release-tools/bin/ReleaseTools/release/ReleaseTools.dll"
      - name: Attest all five final release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*
      - name: Create release only for the explicitly pushed version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          . ./scripts/Common.ps1
          $metadata = Get-PackageMetadata
          $expected = @("$($metadata.ArtifactStem)-setup.exe", "$($metadata.ArtifactStem).zip", 'SHA256SUMS.txt', 'appcast.xml', 'appcast.xml.signature')
          $assets = @(Get-ChildItem ./release -File)
          if ($assets.Count -ne 5 -or (Compare-Object @($expected | Sort-Object) @($assets.Name | Sort-Object))) { throw 'Expected exactly the five verified release assets.' }
          ./scripts/Test-ReleaseAssets.ps1 -Directory ./release -VerifierDll "$env:RUNNER_TEMP/release-tools/bin/ReleaseTools/release/ReleaseTools.dll"
          gh release create $env:RELEASE_TAG --verify-tag --title $env:RELEASE_TAG --latest --draft=false --prerelease=false --notes-file packaging/release-notes.ru.md @($assets.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          $published = gh release view $env:RELEASE_TAG --json tagName,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.tagName -cne $env:RELEASE_TAG) { throw 'Release readback failed.' }
          if (Compare-Object @($expected | Sort-Object) @($published.assets.name | Sort-Object)) { throw 'Published assets differ from the verified manifest.' }
          $readback = "$env:RUNNER_TEMP/published-release"
          gh release download $env:RELEASE_TAG --dir $readback
          if ($LASTEXITCODE -ne 0) { throw 'Release download readback failed.' }
          ./scripts/Test-ReleaseAssets.ps1 -Directory $readback -VerifierDll "$env:RUNNER_TEMP/release-tools/bin/ReleaseTools/release/ReleaseTools.dll"
          foreach ($name in $expected) {
            if ((Get-FileHash (Join-Path ./release $name)).Hash -cne (Get-FileHash (Join-Path $readback $name)).Hash) { throw 'Published release bytes changed.' }
          }

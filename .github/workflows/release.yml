name: Tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: windows-packages
          path: release
      - name: Verify tag and downloaded checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ($env:RELEASE_TAG -cne "v$env:BUILD_VERSION") { throw 'Release tag/version mismatch.' }
          $lines = Get-Content ./release/SHA256SUMS.txt
          if (@($lines).Count -ne 2) { throw 'Expected checksums for ZIP and setup.' }
          foreach ($line in $lines) {
            if ($line -cnotmatch '^([0-9a-f]{64})  (TJCloudClient-[0-9.]+-win-x64(?:-setup\.exe|\.zip))$') { throw 'Invalid checksum entry.' }
            $hash = $Matches[1]
            $path = Join-Path ./release $Matches[2]
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) { throw 'Artifact checksum mismatch.' }
          }
      - name: Attest verified release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*
      - name: Create release only for the explicitly pushed version tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem ./release -File)
          if ($assets.Count -ne 3) { throw 'Expected ZIP, setup and checksums only.' }
          gh release create $env:RELEASE_TAG --verify-tag --title $env:RELEASE_TAG --notes 'Self-contained Windows x64 client. Unsigned application and installer. Verify SHA256SUMS.txt and the GitHub artifact attestations. This release is not a WinGet submission.' @($assets.FullName)
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          $published = gh release view $env:RELEASE_TAG --json tagName,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.tagName -cne $env:RELEASE_TAG) { throw 'Release readback failed.' }
          if (Compare-Object @($assets.Name | Sort-Object) @($published.assets.name | Sort-Object)) { throw 'Published assets do not match the verified distribution.' }

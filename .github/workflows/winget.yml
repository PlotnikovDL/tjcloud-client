name: Verify WinGet manifest

on: workflow_dispatch

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare WinGet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $winget = Get-Command winget -ErrorAction SilentlyContinue
          if (!$winget -or [version]((winget --version).TrimStart('v')) -lt [version]'1.28.0') {
            $tools = Join-Path $env:RUNNER_TEMP 'winget-client'
            $bundle = 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle'
            $dependencies = 'DesktopAppInstaller_Dependencies.zip'
            gh release download v1.29.380 --repo microsoft/winget-cli --pattern $bundle --pattern $dependencies --dir $tools
            if ($LASTEXITCODE) { throw 'Microsoft WinGet download failed.' }
            $bundlePath = Join-Path $tools $bundle
            $zipPath = Join-Path $tools $dependencies
            if ((Get-FileHash $bundlePath).Hash -ine '65dea9c01ce08ee7b763366b27c0e651f97db857c11ca9b9c301826c10092f2e' -or
                (Get-FileHash $zipPath).Hash -ine 'ba875afe9d190f61218985ac0292a99d1db710bf93e13c68944ca9d89f0d82d1') { throw 'WinGet file checksum mismatch.' }
            Expand-Archive -LiteralPath $zipPath -DestinationPath "$tools/dependencies"
            $packages = @(Get-ChildItem -LiteralPath "$tools/dependencies/x64" -File | Where-Object Extension -in '.appx', '.msix')
            if (!$packages.Count) { throw 'Missing x64 WinGet dependencies.' }
            Add-AppxPackage -Path $bundlePath -DependencyPath $packages.FullName -ErrorAction Stop
          }
          winget --version
          if ($LASTEXITCODE) { throw 'WinGet is unavailable.' }
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE) { throw 'Local manifest installation is unavailable.' }
      - name: Validate and install the published package
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/Common.ps1
          $metadata = Get-PackageMetadata
          $tag = "v$($metadata.Version)"
          $name = "$($metadata.ArtifactStem)-setup.exe"
          $url = "$($metadata.RepositoryUrl)/releases/download/$tag/$name"
          $download = "$env:RUNNER_TEMP/release"
          gh release download $tag --pattern $name --dir $download
          if ($LASTEXITCODE) { throw 'Release installer is unavailable.' }
          $setup = Join-Path $download $name
          $manifestRoot = "$env:RUNNER_TEMP/winget"
          ./scripts/New-WinGetManifest.ps1 -InstallerPath $setup -Version $metadata.Version -InstallerUrl $url -OutputDirectory $manifestRoot
          $manifest = Join-Path $manifestRoot "manifests/t/TJCloud/Client/$($metadata.Version)"
          winget validate --manifest $manifest --disable-interactivity
          if ($LASTEXITCODE) { throw 'Manifest validation failed.' }
          $key = "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$($metadata.ProductCode)"
          if (Test-Path -LiteralPath $key) { throw 'The test requires a clean runner.' }
          $start = [Diagnostics.ProcessStartInfo]::new((Get-Command winget).Source)
          $start.UseShellExecute = $false
          foreach ($argument in @('install','--manifest',$manifest,'--silent','--accept-source-agreements','--disable-interactivity','--verbose-logs','--log',"$env:RUNNER_TEMP/winget-setup.log")) {
            $start.ArgumentList.Add($argument)
          }
          $install = [Diagnostics.Process]::Start($start)
          try {
            if (!$install.WaitForExit(150000)) {
              $output = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/winget-diagnostics" -Force
              Add-Type -AssemblyName UIAutomationClient
              $desktop = [System.Windows.Automation.AutomationElement]::RootElement
              $condition = [System.Windows.Automation.Condition]::TrueCondition
              $windows = $desktop.FindAll([System.Windows.Automation.TreeScope]::Children, $condition)
              foreach ($window in $windows) {
                $owner = Get-Process -Id $window.Current.ProcessId -ErrorAction SilentlyContinue
                if ($owner -and $owner.Name -match 'smart|consent|winget|TJCloud|ApplicationFrameHost|explorer') {
                  $window.Current.Name | Out-File "$output/desktop.txt" -Append
                  $window.FindAll([System.Windows.Automation.TreeScope]::Descendants, $condition) |
                    ForEach-Object { $_.Current.Name } | Where-Object { $_ } | Out-File "$output/desktop.txt" -Append
                }
              }
              Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'winget|TJCloudClient|\.tmp$|consent|smartscreen' } |
                Select-Object ProcessId,ParentProcessId,SessionId,Name,ExecutablePath,CommandLine |
                ConvertTo-Json | Set-Content "$output/before-timeout.json"
              throw 'WinGet installation timed out. See installer diagnostics.'
            }
            if ($install.ExitCode -ne 0) { throw "Manifest installation failed with exit code $($install.ExitCode)." }
          } finally { $install.Dispose() }
          $entry = Get-ItemProperty -LiteralPath $key
          if ($entry.InstallLocation.TrimEnd('\') -ine (Join-Path $env:ProgramFiles 'TJCloudClient')) { throw 'Unexpected installation path.' }
          if ($entry.DisplayName -cne $metadata.Product -or $entry.DisplayVersion -cne $metadata.Version -or $entry.Publisher -cne $metadata.Publisher) {
            throw 'Installed package registration differs from the manifest.'
          }
          $exe = Join-Path $entry.InstallLocation 'TjCloudClient.exe'
          ./scripts/Test-Smoke.ps1 -ExePath $exe -ExpectedMode installed -ReportDirectory "$env:RUNNER_TEMP/gui-smoke"
          winget uninstall --manifest $manifest --silent --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -or (Test-Path -LiteralPath $key) -or (Test-Path -LiteralPath $exe)) { throw 'Manifest uninstall failed.' }
      - name: Collect installer diagnostics
        if: failure() || cancelled()
        run: |
          $output = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/winget-diagnostics" -Force
          $logs = Join-Path $env:LOCALAPPDATA 'Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/DiagOutputDir'
          if (Test-Path $logs) { Get-ChildItem $logs -File | Copy-Item -Destination $output.FullName }
          if (Test-Path "$env:RUNNER_TEMP/winget-setup.log") { Copy-Item "$env:RUNNER_TEMP/winget-setup.log" $output.FullName }
          Get-Process | Where-Object { $_.MainWindowTitle -or $_.Name -match 'winget|TJCloudClient|consent|smartscreen' } |
            Select-Object Id,Name,MainWindowTitle | ConvertTo-Json | Set-Content "$output/windows.json"
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'winget|TJCloudClient|\.tmp$|consent|smartscreen' } |
            Select-Object ProcessId,ParentProcessId,Name,ExecutablePath,CommandLine | ConvertTo-Json | Set-Content "$output/processes.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure() || cancelled()
        with:
          name: winget-diagnostics
          path: ${{ runner.temp }}/winget-diagnostics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: winget-manifests
          path: ${{ runner.temp }}/winget/manifests
          if-no-files-found: error

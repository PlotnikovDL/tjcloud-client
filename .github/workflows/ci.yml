name: Windows build

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    outputs:
      version:
        description: Version read from Directory.Build.props
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

env:
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  policy:
    name: policy
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check PR route and release ancestry
        shell: pwsh
        run: ./scripts/Test-BranchPolicy.ps1

  build:
    needs: policy
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Read metadata and verify release tag
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          . ./scripts/Common.ps1
          $metadata = Get-PackageMetadata
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne "v$($metadata.Version)") {
            throw 'Release tag does not match Directory.Build.props.'
          }
          "version=$($metadata.Version)" >> $env:GITHUB_OUTPUT
      - name: Locked build, packaging tests, native tests and publish smoke
        run: ./scripts/Build.ps1 -ArtifactsRoot "$env:RUNNER_TEMP/build-output"
      - name: Extract verified portable Inno Setup compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Get-InnoCompiler.ps1 -ToolRoot "$env:RUNNER_TEMP/inno-6.7.4"
      - name: Compile Russian machine-wide installer and create ZIP with checksums
        run: |
          ./scripts/Package.ps1 -PublishDirectory "$env:RUNNER_TEMP/build-output/publish" -OutputDirectory "$env:RUNNER_TEMP/packages" -IsccPath "$env:RUNNER_TEMP/inno-6.7.4/compiler/ISCC.exe"
      - name: Smoke test the extracted ZIP
        run: |
          $zip = Get-ChildItem "$env:RUNNER_TEMP/packages/*.zip"
          if (@($zip).Count -ne 1) { throw 'Expected exactly one ZIP.' }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath "$env:RUNNER_TEMP/zip-probe/app"
          ./scripts/Test-Smoke.ps1 -ExePath "$env:RUNNER_TEMP/zip-probe/app/TjCloudClient.exe" -ExpectedMode portable
      - name: Test synthetic signing and compile restart probes
        run: |
          ./scripts/Build-ReleaseTools.ps1 -ArtifactsRoot "$env:RUNNER_TEMP/release-tools"
          ./scripts/Get-AppCastGenerator.ps1 -ToolRoot "$env:RUNNER_TEMP/appcast-generator"
          $setup = Get-ChildItem "$env:RUNNER_TEMP/packages/*-setup.exe"
          if (@($setup).Count -ne 1) { throw 'Expected exactly one installer.' }
          ./scripts/Test-ReleaseSigning.ps1 -SetupPath $setup.FullName -VerifierDll "$env:RUNNER_TEMP/release-tools/bin/ReleaseTools/release/ReleaseTools.dll" -WorkRoot "$env:RUNNER_TEMP/signing-tests" -GeneratorPath "$env:RUNNER_TEMP/appcast-generator/netsparkle-generate-appcast.exe"
          ./scripts/New-InstallerProbe.ps1 -ToolsDirectory "$env:RUNNER_TEMP/release-tools/bin/ReleaseTools/release" -OutputDirectory "$env:RUNNER_TEMP/probe-old" -Version '0.0.1' -IsccPath "$env:RUNNER_TEMP/inno-6.7.4/compiler/ISCC.exe"
          ./scripts/New-InstallerProbe.ps1 -ToolsDirectory "$env:RUNNER_TEMP/release-tools/bin/ReleaseTools/release" -OutputDirectory "$env:RUNNER_TEMP/probe-new" -Version '${{ steps.metadata.outputs.version }}' -IsccPath "$env:RUNNER_TEMP/inno-6.7.4/compiler/ISCC.exe"
      - name: Test current and next release version fixtures
        run: |
          ./scripts/New-InstallerProbe.ps1 -ToolsDirectory "$env:RUNNER_TEMP/release-tools/bin/ReleaseTools/release" -OutputDirectory "$env:RUNNER_TEMP/version-probe-1.0.0" -Version '1.0.0' -IsccPath "$env:RUNNER_TEMP/inno-6.7.4/compiler/ISCC.exe"
          ./scripts/New-InstallerProbe.ps1 -ToolsDirectory "$env:RUNNER_TEMP/release-tools/bin/ReleaseTools/release" -OutputDirectory "$env:RUNNER_TEMP/version-probe-1.0.1" -Version '1.0.1' -IsccPath "$env:RUNNER_TEMP/inno-6.7.4/compiler/ISCC.exe"
          $env:RELEASE_TEST_TOOLS_DLL = "$env:RUNNER_TEMP/release-tools/bin/ReleaseTools/release/ReleaseTools.dll"
          $env:RELEASE_TEST_DOTNET = (Get-Command dotnet).Source
          $env:RELEASE_TEST_SETUP_1_0_0 = "$env:RUNNER_TEMP/version-probe-1.0.0/TJCloudClient-1.0.0-win-x64-setup.exe"
          $env:RELEASE_TEST_SETUP_1_0_1 = "$env:RUNNER_TEMP/version-probe-1.0.1/TJCloudClient-1.0.1-win-x64-setup.exe"
          $result = python -m unittest discover -s tests -p test_release_versions.py -v 2>&1
          $code = $LASTEXITCODE
          $result | Set-Content "$env:RUNNER_TEMP/release-version-tests.log"
          $result | Write-Host
          if ($code -ne 0 -or ($result -match 'skipped=')) { throw 'Release version regression failed or skipped.' }
      - name: Hosted installer and synthetic restart acceptance
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP/packages/*-setup.exe"
          if (@($setup).Count -ne 1) { throw 'Expected exactly one installer.' }
          $newProbe = Get-ChildItem "$env:RUNNER_TEMP/probe-new/*-setup.exe"
          if (@($newProbe).Count -ne 1) { throw 'Expected exactly one restart probe installer.' }
          ./scripts/Test-Installer.ps1 -SetupPath $setup.FullName -PublishDirectory "$env:RUNNER_TEMP/build-output/publish" -RestartProbeOldSetupPath "$env:RUNNER_TEMP/probe-old/TJCloudClient-0.0.1-win-x64-setup.exe" -RestartProbeSetupPath $newProbe.FullName
      - name: Hosted signed client update E2E
        run: |
          ./scripts/Test-AutoUpdateE2E.ps1 -ArtifactsRoot "$env:RUNNER_TEMP/updater-e2e" -IsccPath "$env:RUNNER_TEMP/inno-6.7.4/compiler/ISCC.exe"
      - name: Upload verified distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: windows-packages
          archive: true
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload native test and smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: windows-evidence
          archive: true
          path: |
            ${{ runner.temp }}/build-output/native-tests.log
            ${{ runner.temp }}/wizard-evidence/*
            ${{ runner.temp }}/build-output/gui-smoke/*
            ${{ runner.temp }}/zip-probe/gui-smoke/*
            ${{ runner.temp }}/gui-smoke/*
            ${{ runner.temp }}/restart-probe.jsonl
            ${{ runner.temp }}/release-version-tests.log
            ${{ runner.temp }}/updater-e2e/hosted-result.json
            ${{ runner.temp }}/updater-e2e/source-manifest.json
            ${{ runner.temp }}/updater-e2e/preparation.json
            ${{ runner.temp }}/updater-e2e/*.log
            ${{ runner.temp }}/updater-e2e/*/*.json
            ${{ runner.temp }}/updater-e2e/*/*.log
          if-no-files-found: warn
          retention-days: 14
